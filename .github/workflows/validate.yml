name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skill-maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run skill-maintenance validators
        run: |
          python scripts/validate-skill.py .
          python scripts/check-references.py .
          python scripts/check-contents.py .

      - name: Whitespace diff check
        if: github.event_name == 'pull_request'
        run: git diff --check origin/${{ github.base_ref }}...HEAD
